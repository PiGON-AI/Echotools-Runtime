# Builds the whisper.cpp command-line binary for the three desktop platforms
# from ONE pinned upstream commit, and publishes them as run artifacts with a
# SHA-256 list. Nothing is released by this workflow: the binaries are tested
# by ear on real machines first, then attached by hand to the `whisper-v1`
# release together with the model, and the hashes are pinned in the
# extensions' source. Every pin therefore points back to a public run log.
#
# Why we build instead of downloading: upstream attaches no binaries to its
# releases (v1.9.4, checked 2026-09-29), only source archives.
#
# Portability: GGML_NATIVE is OFF so the binary is not tuned to the runner's
# CPU; x64 targets AVX2 + FMA + F16C (every desktop CPU since about 2013);
# Apple silicon builds the Metal backend, which is the default there, with
# the shader library embedded so the binary stands alone.

name: whisper-v1

on:
  workflow_dispatch:
    inputs:
      whisper_commit:
        description: "ggml-org/whisper.cpp commit to build (v1.9.4 = 927cfce34f31707e17f2bff35c349632fb9e2c3a)"
        required: true
        default: "927cfce34f31707e17f2bff35c349632fb9e2c3a"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No OpenMP and a static C runtime on Windows and Linux: the first
          # build imported VCOMP140/MSVCP140 on Windows and libgomp.so.1 on
          # Linux, which a fresh machine may not have (found by running the
          # Linux binary in a bare Ubuntu 22.04 container, 2026-09-29). ggml's
          # own thread pool takes over; the binary depends on the OS alone.
          - name: windows-x64
            os: windows-latest
            exe: whisper-cli.exe
            suffix: .exe
            flags: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - name: macos-arm64
            os: macos-14
            exe: whisper-cli
            suffix: ""
            flags: -DGGML_NATIVE=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
          - name: linux-x64
            os: ubuntu-22.04
            exe: whisper-cli
            suffix: ""
            flags: -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_OPENMP=OFF -DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++\ -static-libgcc
    steps:
      - name: Check out whisper.cpp at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ inputs.whisper_commit }}
          path: whisper.cpp

      - name: Configure
        shell: bash
        working-directory: whisper.cpp
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DWHISPER_BUILD_TESTS=OFF
          -DWHISPER_BUILD_SERVER=OFF
          -DWHISPER_BUILD_EXAMPLES=ON
          ${{ matrix.flags }}

      - name: Build whisper-cli
        shell: bash
        working-directory: whisper.cpp
        run: cmake --build build --config Release --target whisper-cli --parallel

      - name: Collect
        shell: bash
        working-directory: whisper.cpp
        run: |
          set -euo pipefail
          out="../pack"
          mkdir -p "$out"
          bin="$(find build/bin -name '${{ matrix.exe }}' -type f | head -1)"
          test -n "$bin"
          cp "$bin" "$out/${{ matrix.exe }}"
          cp LICENSE "$out/LICENSE-whisper.cpp.txt"
          {
            echo "whisper.cpp commit: ${{ inputs.whisper_commit }}"
            echo "platform: ${{ matrix.name }}"
            echo "runner image: ${{ runner.os }} / ${{ matrix.os }}"
            echo "cmake flags: -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF ${{ matrix.flags }}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$out/BUILD-INFO.txt"
          cd "$out"
          "./${{ matrix.exe }}" --help > /dev/null 2>&1 || echo "note: --help exited non-zero (expected on some builds)"
          # The binary ships RAW (the extensions never extract archives), under
          # a platform-qualified name, beside its licence and build record.
          # openssl is the one hashing tool every runner image carries.
          mv "${{ matrix.exe }}" "whisper-cli-${{ matrix.name }}${{ matrix.suffix }}"
          # Portability receipt in the run log: what the binary still needs
          # from the OS. Linux: the dynamic libraries; Windows: the DLL names.
          echo "--- runtime dependencies ---"
          if [ "${{ runner.os }}" = "Linux" ]; then ldd "whisper-cli-${{ matrix.name }}"; fi
          if [ "${{ runner.os }}" = "macOS" ]; then otool -L "whisper-cli-${{ matrix.name }}"; fi
          if [ "${{ runner.os }}" = "Windows" ]; then grep -a -o -i '[a-z0-9_.-]*\.dll' "whisper-cli-${{ matrix.name }}.exe" | sort -u; fi
          echo "----------------------------"
          openssl dgst -sha256 -r "whisper-cli-${{ matrix.name }}${{ matrix.suffix }}" | tee SHA256SUMS-${{ matrix.name }}.txt
          wc -c < "whisper-cli-${{ matrix.name }}${{ matrix.suffix }}" | tr -d ' ' | sed 's/$/ bytes/'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-${{ matrix.name }}
          path: |
            pack/whisper-cli-${{ matrix.name }}${{ matrix.suffix }}
            pack/LICENSE-whisper.cpp.txt
            pack/BUILD-INFO.txt
            pack/SHA256SUMS-${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 30
